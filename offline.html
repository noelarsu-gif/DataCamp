<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATACAMP — Sense connexió</title>
    <style>
        :root { --primary: #c60c30; --dark: #111827; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: #f3f4f6;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 24px;
        }
        .card {
            background: white; border-radius: 16px;
            padding: 40px 28px; text-align: center;
            max-width: 360px; width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .icon { font-size: 3.5rem; margin-bottom: 16px; }
        h1 { font-size: 1.4rem; color: var(--dark); margin-bottom: 8px; }
        p { color: #6b7280; font-size: 0.92rem; line-height: 1.6; margin-bottom: 20px; }
        .badge {
            display: inline-block;
            background: #fef3c7; color: #92400e;
            border: 1px solid #fcd34d;
            border-radius: 20px; padding: 4px 14px;
            font-size: 0.8rem; font-weight: 600;
            margin-bottom: 24px;
        }
        button {
            background: var(--primary); color: white;
            border: none; border-radius: 10px;
            padding: 14px 28px; font-size: 1rem;
            font-weight: 700; cursor: pointer; width: 100%;
        }
        button:active { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <div class="badge">⚡ Mode Offline</div>
        <h1>Sense connexió a Internet</h1>
        <p>
            La primera vegada que obris <strong>DATACAMP</strong> necessites connexió 
            perquè el navegador descarregui l'app. Un cop carregada, funcionarà 
            completament sense internet.
        </p>
        <p>Comprova la connexió i torna-ho a intentar.</p>
        <button onclick="window.location.reload()">🔄 Tornar a intentar</button>
    </div>
</body>
</html>
